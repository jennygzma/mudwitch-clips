    margin: 0 auto;
  }

    align-items: baseline;

    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }

    background: var(--accent-bg);
  }

    display: none;
  }

    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }

    flex-shrink: 0;

    font-weight: 600;

<body>

<div class="topbar">
  <div>
    <h1>Mud Witch — Clip Selector</h1>
    <p>Check the clips you want, then export the selection as JSONL.</p>
  </div>
  <div class="actions">
    <button class="select-link" id="selectAllBtn">select all</button>
    <button class="select-link" id="selectNoneBtn">clear</button>
    <button class="toggle-btn" id="sortSelectedBtn">Sort: selected first</button>
    <span class="selected-count" id="selectedCount">0 selected</span>
    <button id="exportBtn">Export selected (.jsonl)</button>
  </div>
</div>

  <input type="text" id="searchInput" placeholder="Search transcript text, visual description, tags, or source video name…">
</div>

with bold text, parked car, and a pedestrian.", "medium-wide", "eye-level", "Bright, natural sunlight with soft shadows.", "Sign is prominently placed in the right foreground, using rule-of-thirds; background shows depth with trees, cars, and a receding sidewalk.", "Dominant colors are pastel pink, green, orange, and purple on the sign; neutral tones in the background; overall warm and inviting mood.", "Sign in sharp focus, background elements including the pedestrian and car are out of focus.", "Friendly, welcoming, and uplifting with a playful touch."]}, {"index": 82, "file": "82-walking-in.mp4", "videoName": "B003C061_240719AN", "start": 19.1, "end": 24.8, "text": "walking in", "kind": "broll", "tasks": ["broll_only"], "visualCaption": "A colorful sidewalk sign with handwritten text is in the foreground, while a person walks away in the background along a sunny street.", "visualTags": ["Urban sidewalk outside a store on a sunny day.", "Handmade sign with bold text, parked car, and a pedestrian.", "medium-wide", "eye-level", "Bright, natural sunlight with soft shadows.", "Sign is prominently placed in the right foreground, using rule-of-thirds; background shows depth with trees, cars, and a receding sidewalk.", "Dominant colors are pastel pink, green, orange, and purple on the sign; neutral tones in the background; overall warm and inviting mood.", "Sign in sharp focus, background elements including the pedestrian and car are out of focus.", "Friendly, welcoming, and uplifting with a playful touch."]}];

const TABS = [
  { key: "task1", title: "Task 1 — Playful Pottery" },
  { key: "task2", title: "Task 2 — Mud Witch" },
  { key: "broll_only", title: "Other / B-roll" },
];

const tabsEl = document.getElementById("tabs");
const app = document.getElementById("app");
const selectedCountEl = document.getElementById("selectedCount");
const searchInput = document.getElementById("searchInput");
const sortSelectedBtn = document.getElementById("sortSelectedBtn");

let activeTab = TABS[0].key;
let sortSelectedFirst = false;

function formatDuration(totalSeconds) {
  const s = Math.round(totalSeconds);
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return `${m}:${String(rem).padStart(2, "0")}`;
}

function updateCount() {
  const checkedRows = Array.from(document.querySelectorAll('.row'))
    .filter(row => row.querySelector('input[type="checkbox"]').checked);
  const seen = new Set();
  let totalSeconds = 0;
  for (const row of checkedRows) {
    const idx = Number(row.dataset.clipIndex);
    if (seen.has(idx)) continue;
    seen.add(idx);
    const clip = CLIPS.find(c => c.index === idx);
    totalSeconds += clip.end - clip.start;
  }
  selectedCountEl.textContent = `${seen.size} selected · ${formatDuration(totalSeconds)} total`;
}

function searchableText(clip) {
  return [clip.text, clip.visualCaption, ...(clip.visualTags || []), clip.videoName]
    .join(" ")
    .toLowerCase();
}

function renderTabs() {
  tabsEl.innerHTML = "";
  TABS.forEach(({ key, title }) => {
    const clips = CLIPS.filter(c => c.tasks.includes(key));
    if (clips.length === 0) return;
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (key === activeTab ? " active" : "");
    btn.textContent = `${title} (${clips.length})`;
    btn.addEventListener("click", () => {
      activeTab = key;
      renderTabs();
      renderPanels();
    });
    tabsEl.appendChild(btn);
  });
}

function buildRow(clip) {
  const row = document.createElement("label");
  row.className = "row";
  row.dataset.clipIndex = clip.index;

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.addEventListener("change", () => {
    row.classList.toggle("checked", checkbox.checked);
    updateCount();
    if (sortSelectedFirst) applySort(row.closest(".list"));
  });

  const video = document.createElement("video");
  video.src = clip.file;
  video.controls = true;
  video.preload = "metadata";

  const info = document.createElement("div");
  info.className = "info";
  const kindClass = clip.kind === "interview" ? "kind-tag interview" : "kind-tag";
  info.innerHTML = `
    <div class="caption"></div>
    <div class="visual-caption"></div>
    <div class="subinfo">${clip.videoName} · ${clip.start.toFixed(1)}s–${clip.end.toFixed(1)}s <span class="${kindClass}">${clip.kind}</span></div>
  `;
  info.querySelector(".caption").textContent = clip.text;
  const vc = info.querySelector(".visual-caption");
  if (clip.visualCaption) {
    vc.textContent = clip.visualCaption;
  } else {
    vc.remove();
  }

  row.appendChild(checkbox);
  row.appendChild(video);
  row.appendChild(info);
  return row;
}

function applySort(list) {
  if (!list) return;
  const rows = Array.from(list.children);
  rows.sort((a, b) => {
    const aChecked = a.classList.contains("checked") ? 0 : 1;
    const bChecked = b.classList.contains("checked") ? 0 : 1;
    return aChecked - bChecked;
  });
  rows.forEach(r => list.appendChild(r));
}

function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  document.querySelectorAll(".tab-panel.active .row").forEach(row => {
    const clip = CLIPS.find(c => c.index === Number(row.dataset.clipIndex));
    const match = !q || searchableText(clip).includes(q);
    row.classList.toggle("hidden", !match);
  });
  document.querySelectorAll(".tab-panel.active .list").forEach(list => {
    const anyVisible = Array.from(list.children).some(r => !r.classList.contains("hidden"));
    let empty = list.parentElement.querySelector(".empty-state");
    if (!anyVisible) {
      if (!empty) {
        empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No clips match your search.";
        list.after(empty);
      }
    } else if (empty) {
      empty.remove();
    }
  });
}

function renderPanels() {
  app.innerHTML = "";
  TABS.forEach(({ key, title }) => {
    const clips = CLIPS.filter(c => c.tasks.includes(key))
      .slice()
      .sort((a, b) => a.videoName.localeCompare(b.videoName) || a.start - b.start);
    if (clips.length === 0) return;

    const panel = document.createElement("div");
    panel.className = "tab-panel" + (key === activeTab ? " active" : "");
    panel.dataset.tabKey = key;

    const section = document.createElement("section");
    const heading = document.createElement("h2");
    heading.innerHTML = `${title} <span class="count">${clips.length} clip${clips.length === 1 ? "" : "s"}</span>`;
    section.appendChild(heading);

    const list = document.createElement("div");
    list.className = "list";
    clips.forEach(clip => list.appendChild(buildRow(clip)));
    section.appendChild(list);

    panel.appendChild(section);
    app.appendChild(panel);
  });
  if (sortSelectedFirst) {
    document.querySelectorAll(".tab-panel.active .list").forEach(applySort);
  }
  applyFilter();
}

document.getElementById("selectAllBtn").addEventListener("click", () => {
  document.querySelectorAll(".tab-panel.active input[type=\"checkbox\"]").forEach(cb => {
    cb.checked = true;
    cb.closest(".row").classList.add("checked");
  });
  updateCount();
});

document.getElementById("selectNoneBtn").addEventListener("click", () => {
  document.querySelectorAll(".tab-panel.active input[type=\"checkbox\"]").forEach(cb => {
    cb.checked = false;
    cb.closest(".row").classList.remove("checked");
  });
  updateCount();
});

sortSelectedBtn.addEventListener("click", () => {
  sortSelectedFirst = !sortSelectedFirst;
  sortSelectedBtn.classList.toggle("active", sortSelectedFirst);
  if (sortSelectedFirst) {
    document.querySelectorAll(".tab-panel.active .list").forEach(applySort);
  }
});

searchInput.addEventListener("input", applyFilter);

document.getElementById("exportBtn").addEventListener("click", () => {
  const checkedRows = Array.from(document.querySelectorAll('.row'))
    .filter(row => row.querySelector('input[type="checkbox"]').checked);

  if (checkedRows.length === 0) {
    alert("No clips selected.");
    return;
  }

  const seen = new Set();
  const lines = [];
  for (const row of checkedRows) {
    const idx = Number(row.dataset.clipIndex);
    if (seen.has(idx)) continue;
    seen.add(idx);
    const clip = CLIPS.find(c => c.index === idx);
    lines.push(JSON.stringify({
      videoName: clip.videoName,
      start: clip.start,
      end: clip.end,
      text: clip.text,
      kind: clip.kind,
    }));
  }

  const blob = new Blob([lines.join("\n") + "\n"], { type: "application/jsonl" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "mudwitch-selected-clips.jsonl";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

renderTabs();
renderPanels();
</script>
